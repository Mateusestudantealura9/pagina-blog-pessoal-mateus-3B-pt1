<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Black-bulls</title>
    <style>
        header{
            background-color:dimgrey;
            color: white;
            text-align: center;
            max-width: 1000px;
            margin: 0 auto;
            padding: 10px;
        }
        main {
            background-color: rgb(48, 92, 4);
            color: blue;
            margin: auto;
            padding: 15px;
        }
    </style>
</head>
<body>
    <header>
<h1>Blog</h1>
<p>anime</p>
    </header>

    <main>
        <article>
            <img src="primeiro.png">
            <div>
                <h2>Top 3 series </h2>
                <p class="artigo">Por:mateus</p>
                <ul>
                    <li>1° - boku no hero   </li>
                    <li>2° - boruto  </li>
                    <li>3° - overlord </li>
                </ul>
                <button>👹<span>0</span></button><button>
                <button>👽<span>0</span></button><button>
            </div>
        </article>
    </main>

    <footer>
        <p class="direitos">Todos os direitos estão reservados ao autor.</p>
    </footer>

</body>
<script>
    const botoes = document.querySelectorAll("button");

    botoes.forEach(function (botao) {
        let curtiu = false;
        botao.addEventListener("click", botaoClicado);

        function botaoClicado() {
            console.log("fui clicado");
            let texto = botao.querySelector("span");

            if (curtiu === false) {
                texto.textContent++;
                curtiu = true;
            } else {
                texto.textContent--;
                curtiu = false;
            }
        }
    });
</script>
</html>
